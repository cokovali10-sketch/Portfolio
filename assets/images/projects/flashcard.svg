<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#66bb6a"/>
      <stop offset="100%" style="stop-color:#2e7d32"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg)"/>
  <rect width="800" height="500" rx="16" fill="url(#grid)"/>
  <g transform="translate(400,205)" filter="url(#glow)">
    <rect x="-70" y="-60" width="140" height="90" rx="8" fill="none" stroke="url(#green)" stroke-width="3"/>
    <rect x="-70" y="-60" width="140" height="90" rx="8" fill="url(#green)" opacity="0.08"/>
    <line x1="-70" y1="-15" x2="70" y2="-15" stroke="#66bb6a" stroke-width="1.5" opacity="0.4"/>
    <text x="0" y="-30" text-anchor="middle" font-family="monospace" font-size="11" fill="#66bb6a" opacity="0.7">FRONT</text>
    <path d="M-25 15 Q-25-10 0-10 Q25-10 25 15 Q25 35 0 40 Q-25 35-25 15" fill="none" stroke="#66bb6a" stroke-width="2" opacity="0.6"/>
    <circle cx="-10" cy="15" r="3" fill="#66bb6a" opacity="0.5"/>
    <circle cx="10" cy="15" r="3" fill="#66bb6a" opacity="0.5"/>
    <path d="M-5 25 Q0 30 5 25" fill="none" stroke="#66bb6a" stroke-width="1.5" opacity="0.5"/>
    <path d="M-15 55 L-15 70 M0 55 L0 75 M15 55 L15 70" stroke="#66bb6a" stroke-width="2" opacity="0.4"/>
    <circle cx="0" cy="60" r="8" fill="none" stroke="#66bb6a" stroke-width="1.5" opacity="0.5"/>
  </g>
  <text x="400" y="395" text-anchor="middle" font-family="monospace" font-size="36" font-weight="bold" fill="#66bb6a" filter="url(#glow)" letter-spacing="4">FLASHCARD</text>
  <text x="400" y="425" text-anchor="middle" font-family="monospace" font-size="12" fill="rgba(102,187,106,0.5)" letter-spacing="6">LEARNING SYSTEM</text>
</svg>
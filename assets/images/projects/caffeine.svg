<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="brown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8d6e63"/>
      <stop offset="100%" style="stop-color:#5d4037"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.15)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.02)"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg)"/>
  <rect width="800" height="500" rx="16" fill="url(#grid)"/>
  <g transform="translate(400,210)" filter="url(#glow)">
    <path d="M-40-60 L-30-60 L-25-30 L-45-30 Z" fill="none" stroke="url(#brown)" stroke-width="2.5"/>
    <ellipse cx="0" cy="-30" rx="45" ry="15" fill="none" stroke="url(#brown)" stroke-width="3"/>
    <ellipse cx="0" cy="-30" rx="45" ry="15" fill="url(#brown)" opacity="0.15"/>
    <path d="M-45-30 L-45 40 Q-45 65 0 65 Q45 65 45 40 L45-30" fill="none" stroke="url(#brown)" stroke-width="3"/>
    <path d="M-45-30 L-45 40 Q-45 65 0 65 Q45 65 45 40 L45-30" fill="url(#brown)" opacity="0.1"/>
    <ellipse cx="0" cy="-30" rx="45" ry="15" fill="url(#glass)"/>
    <path d="M20-50 Q40-45 35-25" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3" stroke-linecap="round"/>
    <path d="M-10 10 Q0 5 10 10 Q0 15-10 10" fill="#8d6e63" opacity="0.3"/>
    <path d="M-15 20 Q-5 15 5 20 Q-5 25-15 20" fill="#8d6e63" opacity="0.2"/>
  </g>
  <text x="400" y="380" text-anchor="middle" font-family="monospace" font-size="36" font-weight="bold" fill="#8d6e63" filter="url(#glow)" letter-spacing="4">CAFFEINE</text>
  <text x="400" y="410" text-anchor="middle" font-family="monospace" font-size="12" fill="rgba(141,110,99,0.5)" letter-spacing="6">DEV PRODUCTIVITY</text>
</svg>
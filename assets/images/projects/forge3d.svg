<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef5350"/>
      <stop offset="100%" style="stop-color:#c62828"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg)"/>
  <rect width="800" height="500" rx="16" fill="url(#grid)"/>
  <g transform="translate(400,205)" filter="url(#glow)">
    <polygon points="-50,-50 50,-50 70,-10 0,10" fill="none" stroke="url(#red)" stroke-width="2.5" opacity="0.7"/>
    <polygon points="-50,-50 50,-50 70,-10 0,10" fill="url(#red)" opacity="0.06"/>
    <polygon points="-50,-50 -70-10 -50,50 0,10" fill="none" stroke="url(#red)" stroke-width="2.5" opacity="0.6"/>
    <polygon points="-50,-50 -70-10 -50,50 0,10" fill="url(#red)" opacity="0.04"/>
    <polygon points="50,-50 70,-10 50,50 0,10" fill="none" stroke="url(#red)" stroke-width="2.5" opacity="0.5"/>
    <polygon points="50,-50 70,-10 50,50 0,10" fill="url(#red)" opacity="0.03"/>
    <line x1="-50" y1="-50" x2="-50" y2="50" stroke="#ef5350" stroke-width="1.5" opacity="0.4"/>
    <line x1="50" y1="-50" x2="50" y2="50" stroke="#ef5350" stroke-width="1.5" opacity="0.4"/>
    <line x1="0" y1="-50" x2="0" y2="10" stroke="#ef5350" stroke-width="1" opacity="0.3"/>
    <circle cx="0" cy="-20" r="8" fill="none" stroke="#ef5350" stroke-width="1.5" opacity="0.5"/>
    <text x="0" y="-17" text-anchor="middle" font-family="monospace" font-size="8" fill="#ef5350" opacity="0.7">3D</text>
  </g>
  <text x="400" y="380" text-anchor="middle" font-family="monospace" font-size="36" font-weight="bold" fill="#ef5350" filter="url(#glow)" letter-spacing="4">FORGE3D</text>
  <text x="400" y="410" text-anchor="middle" font-family="monospace" font-size="12" fill="rgba(239,83,80,0.5)" letter-spacing="6">3D RENDERING ENGINE</text>
</svg>
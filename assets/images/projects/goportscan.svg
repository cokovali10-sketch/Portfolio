<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#42a5f5"/>
      <stop offset="100%" style="stop-color:#1565c0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg)"/>
  <rect width="800" height="500" rx="16" fill="url(#grid)"/>
  <g transform="translate(400,210)" filter="url(#glow)">
    <circle cx="0" cy="0" r="80" fill="none" stroke="url(#blue)" stroke-width="2" opacity="0.3"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="url(#blue)" stroke-width="2" opacity="0.4"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="url(#blue)" stroke-width="2" opacity="0.5"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="url(#blue)" stroke-width="2.5" opacity="0.7"/>
    <line x1="0" y1="0" x2="65" y2="-45" stroke="#42a5f5" stroke-width="2.5" opacity="0.9"/>
    <circle cx="65" cy="-45" r="6" fill="#42a5f5"/>
    <line x1="0" y1="0" x2="-50" y2="60" stroke="#42a5f5" stroke-width="2" opacity="0.6"/>
    <circle cx="-50" cy="60" r="5" fill="#42a5f5" opacity="0.7"/>
    <line x1="0" y1="0" x2="30" y2="70" stroke="#42a5f5" stroke-width="2" opacity="0.6"/>
    <circle cx="30" cy="70" r="5" fill="#42a5f5" opacity="0.7"/>
    <circle cx="0" cy="0" r="5" fill="#90caf9"/>
    <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="6" fill="#0a0a1a" font-weight="bold">P</text>
  </g>
  <text x="400" y="380" text-anchor="middle" font-family="monospace" font-size="34" font-weight="bold" fill="#42a5f5" filter="url(#glow)" letter-spacing="3">GOPORTSCAN</text>
  <text x="400" y="410" text-anchor="middle" font-family="monospace" font-size="12" fill="rgba(66,165,245,0.5)" letter-spacing="6">NETWORK SCANNER</text>
</svg>
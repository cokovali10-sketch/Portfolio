<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#b8860b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg)"/>
  <rect width="800" height="500" rx="16" fill="url(#grid)"/>
  <g transform="translate(400,210)" filter="url(#glow)">
    <ellipse cx="0" cy="10" rx="55" ry="15" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.4"/>
    <path d="M-40-50 Q-50-80-30-90 Q0-100 30-90 Q50-80 40-50 L35-10 Q35 20 0 30 Q-35 20-35-10 Z" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <path d="M-40-50 Q-50-80-30-90 Q0-100 30-90 Q50-80 40-50 L35-10 Q35 20 0 30 Q-35 20-35-10 Z" fill="url(#gold)" opacity="0.1"/>
    <line x1="0" y1="-90" x2="0" y2="-110" stroke="#ffd700" stroke-width="3"/>
    <circle cx="0" cy="-115" r="8" fill="#ffd700" opacity="0.8"/>
    <circle cx="0" cy="-115" r="4" fill="#fff" opacity="0.9"/>
    <path d="M-20-60 L20-60" stroke="url(#gold)" stroke-width="2" opacity="0.6"/>
    <path d="M-25-45 L25-45" stroke="url(#gold)" stroke-width="1.5" opacity="0.4"/>
    <path d="M-15 0 Q-40 10-50 0" stroke="url(#gold)" stroke-width="2.5" fill="none" opacity="0.7"/>
    <path d="M15 0 Q40 10 50 0" stroke="url(#gold)" stroke-width="2.5" fill="none" opacity="0.7"/>
  </g>
  <text x="400" y="380" text-anchor="middle" font-family="monospace" font-size="36" font-weight="bold" fill="#ffd700" filter="url(#glow)" letter-spacing="4">HERMES</text>
  <text x="400" y="410" text-anchor="middle" font-family="monospace" font-size="12" fill="rgba(255,215,0,0.5)" letter-spacing="6">MESSAGING SYSTEM</text>
</svg>
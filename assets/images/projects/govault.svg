<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#2e7d32"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg)"/>
  <rect width="800" height="500" rx="16" fill="url(#grid)"/>
  <g transform="translate(400,210)" filter="url(#glow)">
    <rect x="-65" y="-75" width="130" height="150" rx="10" fill="none" stroke="url(#green)" stroke-width="3"/>
    <rect x="-65" y="-75" width="130" height="150" rx="10" fill="url(#green)" opacity="0.08"/>
    <circle cx="45" cy="0" r="10" fill="none" stroke="#4caf50" stroke-width="2.5"/>
    <circle cx="45" cy="0" r="3" fill="#4caf50"/>
    <rect x="-50" y="-55" width="70" height="5" rx="2" fill="#4caf50" opacity="0.4"/>
    <rect x="-50" y="-42" width="50" height="5" rx="2" fill="#4caf50" opacity="0.3"/>
    <rect x="-50" y="-29" width="60" height="5" rx="2" fill="#4caf50" opacity="0.35"/>
    <rect x="-50" y="10" width="80" height="30" rx="4" fill="none" stroke="#4caf50" stroke-width="1.5" opacity="0.5"/>
    <text x="-10" y="30" font-family="monospace" font-size="12" fill="#4caf50" opacity="0.7">VAULT</text>
  </g>
  <text x="400" y="380" text-anchor="middle" font-family="monospace" font-size="36" font-weight="bold" fill="#4caf50" filter="url(#glow)" letter-spacing="4">GOVAULT</text>
  <text x="400" y="410" text-anchor="middle" font-family="monospace" font-size="12" fill="rgba(76,175,80,0.5)" letter-spacing="6">SECRET MANAGEMENT</text>
</svg>
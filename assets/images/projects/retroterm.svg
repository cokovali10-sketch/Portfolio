<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800"/>
      <stop offset="100%" style="stop-color:#e65100"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg)"/>
  <rect width="800" height="500" rx="16" fill="url(#grid)"/>
  <g transform="translate(400,205)" filter="url(#glow)">
    <rect x="-80" y="-70" width="160" height="140" rx="8" fill="none" stroke="url(#orange)" stroke-width="3"/>
    <rect x="-80" y="-70" width="160" height="140" rx="8" fill="url(#orange)" opacity="0.06"/>
    <rect x="-70" y="-60" width="140" height="8" fill="#ff9800" opacity="0.3" rx="2"/>
    <text x="-60" y="-15" font-family="monospace" font-size="11" fill="#ff9800" opacity="0.7">### DUNGEON MAP ###</text>
    <path d="M-50 0 L-30 0 L-30 20 L10 20 L10 0 L30 0 L30-20 L50-20 L50 10 L30 10" fill="none" stroke="#ffcc00" stroke-width="2" opacity="0.6"/>
    <circle cx="-50" cy="0" r="4" fill="#ff5722"/>
    <circle cx="30" cy="10" r="4" fill="#4caf50"/>
    <text x="-60" y="45" font-family="monospace" font-size="9" fill="#ff9800" opacity="0.5">@...#..$..!</text>
    <text x="-60" y="57" font-family="monospace" font-size="9" fill="#ff9800" opacity="0.5">#..#.....#.</text>
    <rect x="-70" y="65" width="140" height="1" fill="#ff9800" opacity="0.2"/>
  </g>
  <text x="400" y="390" text-anchor="middle" font-family="monospace" font-size="36" font-weight="bold" fill="#ff9800" filter="url(#glow)" letter-spacing="4">RETROTERM</text>
  <text x="400" y="420" text-anchor="middle" font-family="monospace" font-size="12" fill="rgba(255,152,0,0.5)" letter-spacing="6">TERMINAL EMULATOR</text>
</svg>
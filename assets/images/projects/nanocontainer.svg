<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3"/>
      <stop offset="100%" style="stop-color:#1565c0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg)"/>
  <rect width="800" height="500" rx="16" fill="url(#grid)"/>
  <g transform="translate(400,210)" filter="url(#glow)">
    <ellipse cx="0" cy="30" rx="80" ry="25" fill="none" stroke="url(#blue)" stroke-width="3"/>
    <path d="M-80 10 Q-80-60 0-60 Q80-60 80 10" fill="none" stroke="url(#blue)" stroke-width="3"/>
    <path d="M-80 10 Q-80-60 0-60 Q80-60 80 10" fill="url(#blue)" opacity="0.08"/>
    <rect x="-55" y="-40" width="30" height="20" rx="3" fill="none" stroke="#64b5f6" stroke-width="2" opacity="0.6"/>
    <rect x="-15" y="-40" width="30" height="20" rx="3" fill="none" stroke="#64b5f6" stroke-width="2" opacity="0.6"/>
    <rect x="25" y="-40" width="30" height="20" rx="3" fill="none" stroke="#64b5f6" stroke-width="2" opacity="0.6"/>
    <circle cx="-40" cy="10" r="4" fill="#2196f3" opacity="0.7"/>
    <circle cx="0" cy="10" r="4" fill="#2196f3" opacity="0.7"/>
    <circle cx="40" cy="10" r="4" fill="#2196f3" opacity="0.7"/>
    <line x1="-40" y1="10" x2="0" y2="10" stroke="#64b5f6" stroke-width="1.5" opacity="0.5"/>
    <line x1="0" y1="10" x2="40" y2="10" stroke="#64b5f6" stroke-width="1.5" opacity="0.5"/>
  </g>
  <text x="400" y="380" text-anchor="middle" font-family="monospace" font-size="32" font-weight="bold" fill="#2196f3" filter="url(#glow)" letter-spacing="3">NANOCONTAINER</text>
  <text x="400" y="410" text-anchor="middle" font-family="monospace" font-size="12" fill="rgba(33,150,243,0.5)" letter-spacing="6">CONTAINER MANAGEMENT</text>
</svg>
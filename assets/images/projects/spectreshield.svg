<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0"/>
      <stop offset="100%" style="stop-color:#6a1b9a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg)"/>
  <rect width="800" height="500" rx="16" fill="url(#grid)"/>
  <g transform="translate(400,210)" filter="url(#glow)">
    <circle cx="0" cy="0" r="70" fill="none" stroke="url(#purple)" stroke-width="2" stroke-dasharray="8,4" opacity="0.5"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="url(#purple)" stroke-width="3"/>
    <circle cx="0" cy="0" r="50" fill="url(#purple)" opacity="0.1"/>
    <circle cx="0" cy="-30" r="8" fill="#9c27b0" opacity="0.9"/>
    <circle cx="25" cy="15" r="8" fill="#9c27b0" opacity="0.9"/>
    <circle cx="-25" cy="15" r="8" fill="#9c27b0" opacity="0.9"/>
    <line x1="0" y1="-30" x2="25" y2="15" stroke="#ce93d8" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="-30" x2="-25" y2="15" stroke="#ce93d8" stroke-width="2" opacity="0.6"/>
    <line x1="25" y1="15" x2="-25" y2="15" stroke="#ce93d8" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="0" r="5" fill="#e1bee7"/>
    <path d="M-90 0 L-70 0 M70 0 L90 0 M0-90 L0-70 M0 70 L0 90" stroke="url(#purple)" stroke-width="2" opacity="0.4"/>
    <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="10" fill="#e1bee7" opacity="0.7">eBPF</text>
  </g>
  <text x="400" y="380" text-anchor="middle" font-family="monospace" font-size="32" font-weight="bold" fill="#9c27b0" filter="url(#glow)" letter-spacing="3">SPECTRESHIELD</text>
  <text x="400" y="410" text-anchor="middle" font-family="monospace" font-size="12" fill="rgba(156,39,176,0.5)" letter-spacing="6">EBPF PROBE ENGINE</text>
</svg>
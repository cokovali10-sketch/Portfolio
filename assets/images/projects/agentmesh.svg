<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ab47bc"/>
      <stop offset="100%" style="stop-color:#7b1fa2"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg)"/>
  <rect width="800" height="500" rx="16" fill="url(#grid)"/>
  <g transform="translate(400,210)" filter="url(#glow)">
    <line x1="-60" y1="-50" x2="0" y2="-20" stroke="#ce93d8" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="-20" x2="60" y2="-50" stroke="#ce93d8" stroke-width="2" opacity="0.5"/>
    <line x1="-60" y1="-50" x2="-40" y2="30" stroke="#ce93d8" stroke-width="2" opacity="0.5"/>
    <line x1="60" y1="-50" x2="40" y2="30" stroke="#ce93d8" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="-20" x2="0" y2="50" stroke="#ce93d8" stroke-width="2" opacity="0.5"/>
    <line x1="-40" y1="30" x2="40" y2="30" stroke="#ce93d8" stroke-width="2" opacity="0.5"/>
    <line x1="-40" y1="30" x2="0" y2="50" stroke="#ce93d8" stroke-width="2" opacity="0.5"/>
    <line x1="40" y1="30" x2="0" y2="50" stroke="#ce93d8" stroke-width="2" opacity="0.5"/>
    <circle cx="-60" cy="-50" r="10" fill="url(#purple)" opacity="0.9"/>
    <circle cx="0" cy="-20" r="12" fill="url(#purple)" opacity="0.9"/>
    <circle cx="60" cy="-50" r="10" fill="url(#purple)" opacity="0.9"/>
    <circle cx="-40" cy="30" r="10" fill="url(#purple)" opacity="0.9"/>
    <circle cx="40" cy="30" r="10" fill="url(#purple)" opacity="0.9"/>
    <circle cx="0" cy="50" r="10" fill="url(#purple)" opacity="0.9"/>
    <circle cx="0" cy="0" r="15" fill="url(#purple)" opacity="0.7"/>
    <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="8" fill="#f3e5f5" font-weight="bold">MESH</text>
  </g>
  <text x="400" y="380" text-anchor="middle" font-family="monospace" font-size="36" font-weight="bold" fill="#ab47bc" filter="url(#glow)" letter-spacing="4">AGENTMESH</text>
  <text x="400" y="410" text-anchor="middle" font-family="monospace" font-size="12" fill="rgba(171,71,188,0.5)" letter-spacing="6">AGENT NETWORK</text>
</svg>
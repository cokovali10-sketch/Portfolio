<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffeb3b"/>
      <stop offset="100%" style="stop-color:#f9a825"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg)"/>
  <rect width="800" height="500" rx="16" fill="url(#grid)"/>
  <g transform="translate(400,210)" filter="url(#glow)">
    <circle cx="-15" cy="0" r="55" fill="none" stroke="url(#yellow)" stroke-width="3"/>
    <circle cx="-15" cy="0" r="55" fill="url(#yellow)" opacity="0.06"/>
    <line x1="25" y1="35" x2="65" y2="75" stroke="url(#yellow)" stroke-width="5" stroke-linecap="round"/>
    <rect x="-40" y="-35" width="25" height="6" rx="3" fill="#ffeb3b" opacity="0.5"/>
    <rect x="-40" y="-22" width="18" height="6" rx="3" fill="#ffeb3b" opacity="0.4"/>
    <rect x="-40" y="-9" width="22" height="6" rx="3" fill="#ffeb3b" opacity="0.45"/>
    <rect x="-40" y="4" width="15" height="6" rx="3" fill="#ffeb3b" opacity="0.35"/>
    <rect x="-40" y="17" width="20" height="6" rx="3" fill="#ffeb3b" opacity="0.4"/>
  </g>
  <text x="400" y="380" text-anchor="middle" font-family="monospace" font-size="36" font-weight="bold" fill="#ffeb3b" filter="url(#glow)" letter-spacing="4">DISKSCOPE</text>
  <text x="400" y="410" text-anchor="middle" font-family="monospace" font-size="12" fill="rgba(255,235,59,0.5)" letter-spacing="6">DISK ANALYSIS</text>
</svg>
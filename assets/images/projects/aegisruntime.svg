<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff"/>
      <stop offset="100%" style="stop-color:#0097a7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg)"/>
  <rect width="800" height="500" rx="16" fill="url(#grid)"/>
  <g transform="translate(400,205)" filter="url(#glow)">
    <rect x="-50" y="-70" width="100" height="130" rx="8" fill="none" stroke="url(#cyan)" stroke-width="3"/>
    <rect x="-50" y="-70" width="100" height="130" rx="8" fill="url(#cyan)" opacity="0.08"/>
    <circle cx="0" cy="-20" r="25" fill="none" stroke="#00e5ff" stroke-width="2.5"/>
    <path d="M-10-20 L-3-13 L5-22" fill="none" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="-15" y="20" width="30" height="6" rx="3" fill="#00e5ff" opacity="0.5"/>
    <rect x="-20" y="32" width="40" height="4" rx="2" fill="#00e5ff" opacity="0.3"/>
    <circle cx="0" cy="-55" r="4" fill="#00e5ff" opacity="0.6"/>
    <line x1="-8" y1="-55" x2="8" y2="-55" stroke="#0a0a1a" stroke-width="1.5"/>
  </g>
  <text x="400" y="380" text-anchor="middle" font-family="monospace" font-size="32" font-weight="bold" fill="#00e5ff" filter="url(#glow)" letter-spacing="3">AEGISRUNTIME</text>
  <text x="400" y="410" text-anchor="middle" font-family="monospace" font-size="12" fill="rgba(0,229,255,0.5)" letter-spacing="6">RUNTIME SECURITY</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="rust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e65100"/>
      <stop offset="100%" style="stop-color:#bf360c"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg)"/>
  <rect width="800" height="500" rx="16" fill="url(#grid)"/>
  <g transform="translate(400,210)" filter="url(#glow)">
    <path d="M0-85 L65-45 L65 45 Q65 85 0 105 Q-65 85-65 45 L-65-45 Z" fill="none" stroke="url(#rust)" stroke-width="3"/>
    <path d="M0-85 L65-45 L65 45 Q65 85 0 105 Q-65 85-65 45 L-65-45 Z" fill="url(#rust)" opacity="0.1"/>
    <text x="-30" y="-15" font-family="monospace" font-size="32" fill="#e65100" opacity="0.8">&lt;</text>
    <text x="15" y="-15" font-family="monospace" font-size="32" fill="#e65100" opacity="0.8">/&gt;</text>
    <text x="-5" y="45" font-family="monospace" font-size="48" fill="#e65100" opacity="0.9">_</text>
    <rect x="-30" y="-70" width="60" height="4" fill="url(#rust)" opacity="0.5" rx="2"/>
  </g>
  <text x="400" y="380" text-anchor="middle" font-family="monospace" font-size="36" font-weight="bold" fill="#e65100" filter="url(#glow)" letter-spacing="4">COREEDR</text>
  <text x="400" y="410" text-anchor="middle" font-family="monospace" font-size="12" fill="rgba(230,81,0,0.5)" letter-spacing="6">ENDPOINT DETECTION</text>
</svg>